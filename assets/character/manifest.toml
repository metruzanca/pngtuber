# pngtuber character manifest.
# Editing this file changes behavior without recompiling.
# Placeholder rig (generated shapes) until a real skin is installed (Milestone 7).

[character]
skin = "placeholder"
parts_order = ["desk", "body", "head", "eye", "eyelid", "mouth", "keyboard", "mouse_dev", "mouse", "right", "left"]

[character.parts]
desk      = ["desk.png"]
body      = ["body.png"]
head      = ["head.png"]
eye       = ["eye.png"]
eyelid    = ["eyelid_open.png", "eyelid_closed.png"]
keyboard  = ["keyboard.png"]
mouse_dev = ["mouse_dev.png"]
left      = ["left_up.png", "left_down.png"]
right     = ["right_up.png", "right_down.png"]
mouse     = ["mouse_up.png", "mouse_down.png"]
mouth     = ["mouth_1.png", "mouth_2.png", "mouth_3.png"]

# Per-variant offsets: one {x,y} per part variant, in the same order as parts.
[character.offsets]
desk      = [{ x = 0,  y = 148 }]
body      = [{ x = 48,  y = 100 }]
head      = [{ x = 64,  y = 60 }]
eye       = [{ x = 84,  y = 76 }]
eyelid    = [{ x = 84,  y = 76 }, { x = 84, y = 76 }]
keyboard  = [{ x = 85,  y = 78 }]
mouse_dev = [{ x = 126, y = 68 }]
left      = [{ x = 52,  y = 96 }, { x = 52, y = 110 }]
right     = [{ x = 112, y = 96 }, { x = 112, y = 110 }]
mouse     = [{ x = 137, y = 94 }, { x = 137, y = 106 }]
mouth     = [{ x = 84,  y = 100 }, { x = 84, y = 100 }, { x = 84, y = 100 }]

# Per-state variant mapping: part -> state -> variant index. States use the
# activity names (idle, mouse, typing, gaming, talking, sleep); parts use 0
# (default/calm variant) for any state not listed. The mouse hand holds the
# mouse during mouse/gaming; the keyboard hands tap up/down per keystroke via
# the press animation below.
[character.variants]
mouse  = { mouse = 1, gaming = 1 }
eyelid = { sleep = 1 }

# Dynamic part behaviors. Either can be disabled by leaving part empty.
[character.animations]
mouth = { part = "mouth", fps = 10.0 }                      # talk frames cycle while Talking
press = { parts = ["left", "right"], duration_secs = 0.1, variant = 1 } # hands tap down per keystroke
blink = { part = "eyelid", closed_variant = 1, interval_secs = 3.0, duration_secs = 0.15 }
breathing = { parts = ["body", "head"], period_secs = 4.0, amplitude = 0.015 }
hand_move_delay_secs = 1.0                                  # debounce hand-layout changes

# Parts that follow the cursor while the mouse is active (hand + mouse device).
[character.tracking]
parts = ["mouse", "mouse_dev"]
max_x = 20
max_y = 12

# No parts track the cursor (eyes stay fixed); list parts to re-enable.
[character.look]
parts = []
max_x = 10
max_y = 10

[activity]
idle_after_secs = 5.0
sleep_after_secs = 120.0
mic_threshold = 0.08
mic_hysteresis = 0.5
gaming_window_secs = 1.0