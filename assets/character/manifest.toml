# pngtuber character manifest.
# Editing this file changes behavior without recompiling.
# Placeholder rig (generated shapes) until a real skin is installed (Milestone 7).

[character]
skin = "placeholder"
parts_order = ["desk", "body", "head", "eye", "eyelid", "mouth", "keyboard", "mouse_dev", "mouse", "right", "left"]

[character.parts]
desk      = ["desk.png"]
body      = ["body.png"]
head      = ["head.png"]
eye       = ["eye.png"]
eyelid    = ["eyelid_open.png", "eyelid_closed.png"]
keyboard  = ["keyboard.png"]
mouse_dev = ["mouse_dev.png"]
left      = ["left_down.png", "left_up.png"]
right     = ["right_down.png", "right_up.png"]
mouse     = ["mouse_down.png", "mouse_up.png"]
mouth     = ["mouth_1.png", "mouth_2.png", "mouth_3.png"]

# Per-variant offsets: one {x,y} per part variant, in the same order as parts.
# Variant 0 is the default/resting pose — for the arms that's the _down sprite.
[character.offsets]
desk      = [{ x = 0,  y = 148 }]
body      = [{ x = 48,  y = 100 }]
head      = [{ x = 64,  y = 60 }]
eye       = [{ x = 84,  y = 76 }]
eyelid    = [{ x = 84,  y = 76 }, { x = 84, y = 76 }]
keyboard  = [{ x = 85,  y = 78 }]
mouse_dev = [{ x = 126, y = 68 }]
left      = [{ x = 52,  y = 110 }, { x = 52, y = 96 }]
right     = [{ x = 112, y = 110 }, { x = 112, y = 96 }]
mouse     = [{ x = 137, y = 106 }, { x = 137, y = 94 }]
mouth     = [{ x = 84,  y = 100 }, { x = 84, y = 100 }, { x = 84, y = 100 }]

# Parts that drag together in edit mode (eye + eyelid stay on the same spot).
[character.groups]
eyes = ["eye", "eyelid"]

# The mouse hand and left keyboard hand are the same physical hand: only one
# shows at a time in normal mode (both visible in edit mode). The mouse device
# and right hand stay visible at all times.
[character.visibility]
mouse_hand = ["mouse"]
keyboard_hand = ["left"]

# Per-state variant mapping: part -> state -> variant index. States use the
# activity names (idle, mouse, typing, gaming, talking, sleep); parts use 0
# (default/calm variant) for any state not listed. Arms rest down by default
# (variant 0); the press animation lifts them per keystroke.
[character.variants]
eyelid = { sleep = 1 }

# Dynamic part behaviors. Either can be disabled by leaving part empty.
[character.animations]
mouth = { part = "mouth", fps = 10.0 }                      # talk frames cycle while Talking
press = { parts = ["left", "right"], duration_secs = 0.1, variant = 1 } # hands tap down per keystroke
blink = { part = "eyelid", closed_variant = 1, interval_secs = 3.0, duration_secs = 0.15 }
breathing = { parts = ["body", "head"], period_secs = 4.0, amplitude = 0.015 }
hand_move_delay_secs = 0.5                                  # debounce hand-layout changes

# Parts that follow the real mouse while it's active (hand + mouse device).
# Motion comes from global input, so it works even when the window is unfocused.
# The hand (stretch) keeps its top row fixed and stretches toward the mouse;
# the mouse device translates with the cursor.
[character.tracking]
parts = ["mouse", "mouse_dev"]
stretch = ["mouse"]
max_x = 20
max_y = 12
sensitivity = 0.02

# No parts track the cursor (eyes stay fixed); list parts to re-enable.
[character.look]
parts = []
max_x = 10
max_y = 10

[activity]
idle_after_secs = 5.0
sleep_after_secs = 120.0
mic_threshold = 0.08
mic_hysteresis = 0.5
gaming_window_secs = 1.0