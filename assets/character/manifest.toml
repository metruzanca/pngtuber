# pngtuber character manifest.
# Editing this file changes behavior without recompiling.
# Placeholder rig (generated shapes) until a real skin is installed (Milestone 7).

[character]
skin = "placeholder"
parts_order = ["body", "head", "eye", "eyelid", "left", "right", "mouth"]

[character.parts]
body   = ["body.png"]
head   = ["head.png"]
eye    = ["eye.png"]
eyelid = ["eyelid_open.png", "eyelid_closed.png"]
left   = ["left_up.png", "left_down.png"]
right  = ["right_up.png", "right_down.png"]
mouth  = ["mouth_1.png", "mouth_2.png", "mouth_3.png"]

# Per-variant offsets: one {x,y} per part variant, in the same order as parts.
[character.offsets]
body   = [{ x = 48,  y = 100 }]
head   = [{ x = 64,  y = 60 }]
eye    = [{ x = 84,  y = 76 }]
eyelid = [{ x = 84,  y = 76 }, { x = 84, y = 76 }]
left   = [{ x = 52,  y = 96 }, { x = 52, y = 110 }]
right  = [{ x = 112, y = 96 }, { x = 112, y = 110 }]
mouth  = [{ x = 84,  y = 100 }, { x = 84, y = 100 }, { x = 84, y = 100 }]

# Per-state variant mapping: part -> state -> variant index. States use the
# activity names (idle, mouse, typing, gaming, talking, sleep); parts use 0
# (default/calm variant) for any state not listed.
[character.variants]
left   = { typing = 1, gaming = 1 }
right  = { mouse = 1, gaming = 1 }
eyelid = { sleep = 1 }

# Dynamic part behaviors. Either can be disabled by leaving part empty.
[character.animations]
mouth = { part = "mouth", fps = 10.0 }                      # talk frames cycle while Talking
blink = { part = "eyelid", closed_variant = 1, interval_secs = 3.0, duration_secs = 0.15 }

[character.look]
max_x = 10
max_y = 10

[activity]
idle_after_secs = 5.0
sleep_after_secs = 120.0
mic_threshold = 0.08
mic_hysteresis = 0.5
gaming_window_secs = 1.0